name: Pipeline de Seguridad Frontend

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🧹 Lint
        run: npm run lint

      - name: 🏗️ Verificar build de Next.js
        run: npm run build

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Auditoría de dependencias
        run: |
          npm audit --audit-level=high

      - name: 🛡️ Análisis estático de seguridad
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/react
            p/nextjs

      - name: 🔑 Escaneo de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build Docker image
        run: |
          docker build -t nextjs-app .

      - name: 🔎 Escaneo de imagen Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nextjs-app
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
